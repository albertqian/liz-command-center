name: Phoenix Career Radar

on:
  schedule:
    # Mon and Thu 16:30 UTC = 9:30am Phoenix (Arizona has no DST).
    # The script holds the send until 10:00am Phoenix.
    - cron: "30 16 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: career-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python agent.py

      - name: Save sent history
        run: |
          git config user.name "career-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update sent history" && git push)
